run_name: tinyllama_constant_kv_prefix_p32_lall
seed: 81
model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
train_manifest_path: data/phase2/splits/train.jsonl
validation_manifest_path: data/phase2/splits/validation.jsonl
test_manifest_path: data/phase2/splits/test.jsonl
output_dir: experiments/pricai/tinyllama/constant_kv_prefix_p32_lall

train_buckets:
  - clean_english
  - typo_noise_light
  - typo_noise_medium
  - typo_noise_heavy
  - unicode_stress
  - code
  - tokenizer_stress

max_target_length: 64
prefix_length: 32
init_std: 0.02
batch_size: 4
eval_batch_size: 8
steps: 2000
learning_rate: 0.001
weight_decay: 0.01
log_every: 100
eval_every: 1000
