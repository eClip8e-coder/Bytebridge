run_name: recon_fixed_l32
seed: 41
model_name: Qwen/Qwen2.5-0.5B
train_manifest_path: data/phase2/splits/train.jsonl
validation_manifest_path: data/phase2/splits/validation.jsonl
output_dir: experiments/phase4/recon_fixed_l32
boundary_mode: fixed

train_buckets:
  - clean_english
  - typo_noise_light
  - typo_noise_medium
  - typo_noise_heavy
  - unicode_stress
  - code
  - tokenizer_stress

max_prompt_bytes: 128
max_spans: 32
fixed_patch_size: 4
heuristic_max_span_bytes: 8
prompt_suffix: "\n"
byte_embed_dim: 128
adapter_hidden_dim: 256
adapter_depth: 2
dropout: 0.05
batch_size: 12
eval_batch_size: 16
steps: 1000
learning_rate: 0.001
weight_decay: 0.01
log_every: 100
examples_per_eval: 40
