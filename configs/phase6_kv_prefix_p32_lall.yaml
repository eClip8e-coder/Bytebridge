run_name: kv_prefix_p32_lall
seed: 61
model_name: Qwen/Qwen2.5-0.5B
train_manifest_path: data/phase2/splits/train.jsonl
validation_manifest_path: data/phase2/splits/validation.jsonl
test_manifest_path: data/phase2/splits/test.jsonl
output_dir: experiments/phase6/kv_prefix_p32_lall

train_buckets:
  - clean_english
  - typo_noise_light
  - typo_noise_medium
  - typo_noise_heavy
  - unicode_stress
  - code
  - tokenizer_stress

max_prompt_bytes: 128
max_target_length: 64
prompt_suffix: "\n"
prefix_length: 32
pooling_mode: fixed
target_layers: all
num_layers_injected: 24
byte_embed_dim: 128
adapter_hidden_dim: 256
adapter_depth: 2
dropout: 0.05
batch_size: 8
eval_batch_size: 16
steps: 2000
learning_rate: 0.001
weight_decay: 0.01
log_every: 100
eval_every: 1000
