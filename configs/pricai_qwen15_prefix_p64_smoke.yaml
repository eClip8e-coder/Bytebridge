run_name: qwen15_prefix_fixed_p64_smoke
seed: 61
model_name: Qwen/Qwen2.5-1.5B
train_manifest_path: data/phase2/splits/train.jsonl
validation_manifest_path: data/phase2/splits/validation.jsonl
test_manifest_path: data/phase2/splits/test.jsonl
output_dir: experiments/pricai/qwen15/prefix_fixed_p64_smoke

train_buckets:
  - clean_english
  - typo_noise_light
  - typo_noise_medium
  - typo_noise_heavy
  - unicode_stress
  - code
  - tokenizer_stress

max_prompt_bytes: 128
max_target_length: 64
prompt_suffix: "\n"
prefix_length: 64
pooling_mode: fixed
byte_embed_dim: 128
adapter_hidden_dim: 256
adapter_depth: 2
dropout: 0.05
batch_size: 4
eval_batch_size: 8
steps: 20
learning_rate: 0.001
weight_decay: 0.01
log_every: 10
eval_every: 20
